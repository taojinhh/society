<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* 입력창 안에서는 글자 선택을 허용한다 — 위 body의 onselectstart 차단에서만 빼 준다.
   캡처 단계에서 전파를 끊으므로 body의 차단 핸들러까지 가지 않는다. */
document.addEventListener('selectstart', function (e) {
  var t = e.target;
  if (t && t.closest && t.closest('input, textarea, [contenteditable]')) e.stopPropagation();
}, true);
</script>
